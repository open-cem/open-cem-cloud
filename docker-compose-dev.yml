version: '3.1'

services:
  db:
    image: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: cemcloud
      MYSQL_USER: cemcloud
      MYSQL_PASSWORD: rx9gfJWU$5aLe-tq
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql

  mqtt:
    image: hivemq/hivemq-ce:latest
    ports:
      - 1883:1883

  auth:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - 3000:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --hostname-port=3000

volumes:
  db-data: