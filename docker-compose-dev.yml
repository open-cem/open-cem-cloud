services:
  db:
    image: mysql:8
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    ports:
      - 3306:3306
    volumes:
      - ./src/mysql/dev:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql
  mqtt:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    ports:
      - 1883:1883
    volumes:
      - ./src/mqtt-broker:/etc/mosquitto
  auth:
    image: quay.io/keycloak/keycloak:26.7
    ports:
      - 2000:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --hostname-port=2000

volumes:
  db-data:
