version: '3.1'

services:
  backend:
    build: ./src/cem-cloud-backend
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
    ports:
      - 8080:8080
  db:
    image: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: cemcloud
      MYSQL_USER: cemcloud
      MYSQL_PASSWORD: rx9gfJWU$5aLe-tq
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: