# Set the logging levels on some packages
logging.level.root=info
logging.level.ch.fhnw.cemcloudbackend=debug

# Disable Spring Banner on startup
# spring.main.banner-mode=off

# Set the database context
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:3306/cemcloud
spring.datasource.username=${DBUSERNAME:cemcloud}
spring.datasource.password=${DBPASSWORD:rx9gfJWU$5aLe-tq}
# spring.jpa.show-sql=true

# Set the context path under which URL the webapp is accessible
server.servlet.context-path=/api

spring.servlet.multipart.max-file-size=1024KB
spring.servlet.multipart.max-request-size=1024KB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}

# Set the oauth2 token issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri=${HOST:http://localhost}:2000/realms/cem-cloud

# Uploads directory
application.uploadDirectory=uploads
application.mqttHost=${MQTTHOST:localhost}
application.mqttUsername=${MQTTUSERNAME:cem-cloud-backend}
application.mqttPassword=${MQTTPASSWORD:testing123}
