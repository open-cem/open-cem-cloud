plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'io.github.ben-manes.versions'
}

repositories {
    mavenLocal()
    mavenCentral()
}

group = 'ch.fhnw'
version = '0.2.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

defaultTasks "bootRun"

springBoot {
    mainClass = 'ch.fhnw.cemcloudbackend.CemCloudBackendApplication'
}

bootJar {
    // hardcoded jar name due to CMD in Dockerfile
    archiveFileName = 'cem-cloud-backend.jar'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation "com.hivemq:hivemq-mqtt-client:${mqttVersion}"
    implementation 'org.yaml:snakeyaml'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
